<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图像处理流水线与计算机视觉实验平台</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo">CV</div>
        <div class="brand-text">
          <div class="brand-title">视觉实验平台</div>
          <div class="brand-sub">Image Pipeline Lab</div>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot" id="sidebarFoot"></div>
    </aside>

    <main class="main">
      <header class="topbar">
        <h1 class="page-title" id="pageTitle">图像管理</h1>
        <div class="topbar-right">
          <span class="status-dot" id="statusDot"></span>
          <span id="statusText">连接中…</span>
        </div>
      </header>
      <div class="content">
        <section class="view" data-view="upload"></section>
        <section class="view" data-view="pipeline"></section>
        <section class="view" data-view="features"></section>
        <section class="view" data-view="detection"></section>
        <section class="view" data-view="segmentation"></section>
        <section class="view" data-view="style"></section>
        <section class="view" data-view="batch"></section>
        <section class="view" data-view="compare"></section>
        <section class="view" data-view="tuning"></section>
        <section class="view" data-view="history"></section>
      </div>
    </main>
  </div>

  <div class="toasts" id="toasts"></div>
  <div class="modal-backdrop" id="modalBackdrop" hidden></div>

  <script src="/js/api.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/views/upload.js"></script>
  <script src="/js/views/pipeline.js"></script>
  <script src="/js/views/features.js"></script>
  <script src="/js/views/detection.js"></script>
  <script src="/js/views/segmentation.js"></script>
  <script src="/js/views/style.js"></script>
  <script src="/js/views/batch.js"></script>
  <script src="/js/views/compare.js"></script>
  <script src="/js/views/tuning.js"></script>
  <script src="/js/views/history.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
